services:
  - type: web
    name: fork-park
    runtime: static
    buildCommand: "echo 'No build step needed for this static game'"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
