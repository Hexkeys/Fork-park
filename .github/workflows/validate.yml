name: Validate Fork Park

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check smoke-test script syntax
        run: node --check scripts/check-inline-js.cjs
      - name: Validate inline JavaScript and key features
        run: node scripts/check-inline-js.cjs
