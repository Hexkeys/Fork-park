name: Validate Fork Park

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-service:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check server JavaScript syntax
        run: node --check server.js
      - name: Check browser code and deployment configuration
        run: npm run check
      - name: Run HTTP and WebSocket integration tests
        run: npm test
